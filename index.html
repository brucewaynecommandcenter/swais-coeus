<script>
(function(){
  var P=JSON.parse(document.getElementById('payload').textContent);
  var b64=function(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})};
  var KEY='swais-gate-k';
  function unlock(raw){
    return crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']).then(function(k){
      return crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.i)},k,b64(P.c));
    }).then(function(buf){
      var html=new TextDecoder().decode(buf);
      var g=document.getElementById('gate');
      g.classList.add('out');
      setTimeout(function(){
        document.body.className='is-loading';
        g.remove();
        document.body.insertAdjacentHTML('afterbegin',html);
        var s=document.createElement('script');s.src='assets/js/main.js';document.body.appendChild(s);
      },g.classList.contains('instant')?0:650);
    });
  }
  function derive(u,p){
    return crypto.subtle.importKey('raw',new TextEncoder().encode(u+':'+p),'PBKDF2',false,['deriveBits']).then(function(m){
      return crypto.subtle.deriveBits({name:'PBKDF2',salt:b64(P.s),iterations:P.n,hash:'SHA-256'},m,256);
    });
  }
  try{var saved=sessionStorage.getItem(KEY);if(saved){document.getElementById('gate').classList.add('instant');document.getElementById('gate').style.opacity=0;unlock(b64(saved)).catch(function(){sessionStorage.removeItem(KEY);document.getElementById('gate').style.opacity='';});}}catch(e){}
  var f=document.getElementById('gateForm'),btn=document.getElementById('gBtn'),err=document.getElementById('gErr');
  f.addEventListener('submit',function(e){
    e.preventDefault();err.textContent='';btn.disabled=true;btn.textContent='Checking...';
    var raw;
    derive(document.getElementById('gUser').value.trim().toUpperCase(),document.getElementById('gPass').value).then(function(r){raw=r;return unlock(r)}).then(function(){
      try{sessionStorage.setItem(KEY,btoa(String.fromCharCode.apply(null,new Uint8Array(raw))))}catch(e){}
    }).catch(function(){
      btn.disabled=false;btn.textContent='Enter site';err.textContent='Incorrect username or password.';
      var c=document.getElementById('gateCard');c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake');
    });
  });
})();
</script>
